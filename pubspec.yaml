publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2+1
  path: ^1.9.1
  android_alarm_manager_plus: ^5.1.1
  flutter_local_notifications: ^22.3.1
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
